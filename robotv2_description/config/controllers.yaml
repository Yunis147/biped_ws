controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController

    # These MUST be under controller_manager for Gazebo to read them
    gains:
      r_hip_yaw: {p: 200.0, i: 0.1, d: 10.0}
      r_hip_roll_joint: {p: 200.0, i: 0.1, d: 10.0}
      r_hip_pitch_joint: {p: 200.0, i: 0.1, d: 10.0}
      r_knee_joint: {p: 200.0, i: 0.1, d: 10.0}
      r_ankle_pitch_joint: {p: 200.0, i: 0.1, d: 10.0}
      r_ankle_roll_joint: {p: 200.0, i: 0.1, d: 10.0}
      l_hip_yaw: {p: 200.0, i: 0.1, d: 10.0}
      l_hip_roll_joint: {p: 200.0, i: 0.1, d: 10.0}
      l_hip_pitch_joint: {p: 200.0, i: 0.1, d: 10.0}
      l_knee_joint: {p: 200.0, i: 0.1, d: 10.0}
      l_ankle_pitch_joint: {p: 200.0, i: 0.1, d: 10.0}
      l_ankle_roll_joint: {p: 200.0, i: 0.1, d: 10.0}

position_controller:
  ros__parameters:
    joints:
      - r_hip_yaw
      - r_hip_roll_joint
      - r_hip_pitch_joint
      - r_knee_joint
      - r_ankle_pitch_joint
      - r_ankle_roll_joint
      - l_hip_yaw
      - l_hip_roll_joint
      - l_hip_pitch_joint
      - l_knee_joint
      - l_ankle_pitch_joint
      - l_ankle_roll_joint
